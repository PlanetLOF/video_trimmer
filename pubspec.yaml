name: video_trimmer
description: "Video trimmer inspiration from gnome video trimmer with flutter."
publish_to: 'none'

version: 1.0.1+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  file_selector: ^1.1.0
  desktop_drop: ^0.8.4
  path: ^1.9.1
  material_ui: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true